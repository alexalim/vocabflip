<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VocabFlip</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <nav class="tabs" role="tablist">
    <span class="brand">VocabFlip</span>
    <button data-tab="study" class="active">학습</button>
    <button data-tab="browse">탐색</button>
    <button data-tab="stats">통계</button>
    <button data-tab="twister">텅 트위스터</button>
    <button data-tab="ipa">발음 기호</button>
    <button data-tab="settings">설정</button>
  </nav>
</header>

<main>
  <!-- 학습 -->
  <section id="tab-study" class="tab active">
    <div class="deckbar">
      <label>덱 <select id="deck-select"></select></label>
      <div class="counts"><span class="c-new" title="새 카드">0</span> <span class="c-learn" title="학습 중">0</span> <span class="c-due" title="복습">0</span></div>
    </div>
    <div id="card-area"></div>
  </section>

  <!-- 탐색 -->
  <section id="tab-browse" class="tab">
    <div class="toolbar">
      <input id="browse-q" type="search" placeholder="단어 검색">
      <select id="browse-state">
        <option value="">전체 상태</option><option value="new">새 카드</option><option value="learning">학습 중</option>
        <option value="review">복습</option><option value="due">오늘 할 것</option>
      </select>
    </div>
    <table class="browse"><thead><tr><th>단어</th><th>뜻</th><th>덱</th><th>상태</th><th>다음 복습</th></tr></thead><tbody id="browse-body"></tbody></table>
    <div id="browse-more"></div>
  </section>

  <!-- 통계 -->
  <section id="tab-stats" class="tab"><div id="stats-body"></div></section>

  <!-- 텅 트위스터 -->
  <section id="tab-twister" class="tab">
    <div class="toolbar">
      <input id="tw-q" type="search" placeholder="텅 트위스터 검색 (예: sea, peck)">
      <button id="tw-random">무작위</button>
      <label class="rate">속도 <input id="tw-rate" type="range" min="0.5" max="1.3" step="0.1" value="0.9"> <span id="tw-rate-v">0.9×</span></label>
      <label><input id="tw-ipa" type="checkbox"> 발음 기호 보기</label>
    </div>
    <div id="tw-list"></div>
    <p class="credit">출처: <a href="https://tongue-twister.net/en.htm" target="_blank" rel="noopener">1st International Collection of Tongue Twisters</a> © Mr.Twister</p>
  </section>

  <!-- 발음 기호 -->
  <section id="tab-ipa" class="tab">
    <form id="ipa-form" class="toolbar"><input id="ipa-q" type="search" placeholder="영단어 입력 (미국 발음 기호)" autocomplete="off"><button>보기</button></form>
    <div id="ipa-result"></div>
    <h3 class="sub">발음 기호가 궁금할 때 — 기호를 누르면 그 소리가 들어간 단어 15개</h3>
    <div id="phoneme-chart"></div>
    <div id="phoneme-words"></div>
  </section>

  <!-- 설정 -->
  <section id="tab-settings" class="tab">
    <div class="settings">
      <label>하루 새 카드 수 <input id="set-new" type="number" min="0" max="500"></label>
      <label>하루 최대 복습 수 <input id="set-rev" type="number" min="0" max="9999"></label>
      <label>음성 <select id="set-voice"></select></label>
      <label>단어 카드 앞면 자동 발음 <input id="set-autoplay" type="checkbox"></label>
      <div class="row">
        <button id="export-btn">백업 복사</button>
        <button id="import-btn">붙여넣은 백업 가져오기</button>
        <label class="filebtn">백업 파일 가져오기 <input id="import-file" type="file" accept="application/json,.json,.txt"></label>
        <button id="reset-btn" class="danger">학습 기록 초기화</button>
      </div>
      <textarea id="backup-text" placeholder="백업 복사를 누르면 여기에 학습 기록이 나와요. 다른 기기에서는 이 칸에 붙여넣고 '붙여넣은 백업 가져오기'를 누르세요."></textarea>
      <p class="hint">학습 기록은 이 브라우저에만 저장됩니다. PC와 휴대폰은 기록이 따로라서, 옮기려면 백업 복사 → 붙여넣기를 쓰세요.</p>
      <p id="voice-warn" class="warn" hidden></p>
    </div>
  </section>
</main>

<script src="data/deck.js"></script>
<script src="data/content.js"></script>
<script src="data/ipa_dict.js"></script>
<script src="data/phonemes.js"></script>
<script src="data/twisters.js"></script>
<script src="js/srs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
