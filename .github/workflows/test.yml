name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit — SRS 스케줄러
        run: node --test tests/*.test.js
      - name: Unit — IPA 변환 / Schema — 카드 콘텐츠
        working-directory: tools
        run: python -m pytest -q
      - name: data/content.js 가 gen/out 과 일치하는지
        run: |
          python -I tools/merge_content.py
          git diff --exit-code data/content.js
