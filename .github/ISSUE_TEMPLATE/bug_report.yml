name: 버그 제보
description: 앱이 예상과 다르게 동작할 때
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 학습 탭에서 3k 덱 선택
        2. 정답 보기 → 쉬움
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: input
    id: env
    attributes:
      label: 기기와 브라우저
      placeholder: iPhone 15 / Safari, Windows 11 / Chrome 140
    validations:
      required: true
